<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do App</title>
</head>
<body>

    <div class="project-wrapper">
        <!-- JS looks for "project-title" -->
        <h1 id="project-title">My To-Do List</h1>

        <!-- JS looks for "input-container" to list the items -->
        <div id="input-container"></div>
    </div>

</body>
</html>
